name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate custom contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dhanoladeepika
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#db2777&color_dots=#f3edf5,#fbcfe8,#f9a8d4,#c084fc,#7c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4fb8&color_dots=#161b22,#4c1d95,#7e22ce,#c026d3,#f472b6

      - name: Publish snake files to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
