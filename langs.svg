<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="lt ld">
<title id="lt">Repository language mix</title><desc id="ld">Animated bars showing public repository language mix by repository count.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25102f"/><stop offset="1" stop-color="#100815"/></linearGradient>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fff7ff}.title{font-size:18px;font-weight:900;letter-spacing:1.2px}.sub{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#d6bfe0}.label{font-size:15px;font-weight:760}.pct{font-size:14px;font-weight:900;fill:#f0abfc}.track{fill:#5e3568;opacity:.36}@media (prefers-color-scheme:light){.card{fill:#fffafd}text{fill:#342341}.sub{fill:#755f82}.track{fill:#decde8;opacity:.8}}</style></defs>
<rect class="card" x="3" y="3" width="714" height="294" rx="24" fill="url(#bg)" stroke="#7e3b8d" stroke-width="2"/>
<text x="28" y="37" class="title">LANGUAGE MIX</text><text x="28" y="57" class="sub">BY PUBLIC REPOSITORY COUNT · VERIFIED 28 JUL 2026</text>

        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.55s" fill="freeze"/>
          <circle cx="42" cy="86" r="6" fill="#f472b6"/>
          <text x="58" y="91" class="label">Python</text>
          <text x="671" y="91" text-anchor="end" class="pct">62.5%</text>
          <rect x="42" y="105" width="629" height="14" rx="7" class="track"/>
          <rect x="42" y="105" width="0" height="14" rx="7" fill="#f472b6"><animate attributeName="width" from="0" to="393.12" dur="1.15s" begin="0.63s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect>
          <rect x="42" y="105" width="70" height="14" rx="7" fill="#fff" opacity="0"><animate attributeName="x" from="-80" to="690" dur="2.8s" begin="1.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.22;0" dur="2.8s" begin="1.55s" repeatCount="indefinite"/></rect>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.83s" fill="freeze"/>
          <circle cx="42" cy="149" r="6" fill="#c084fc"/>
          <text x="58" y="154" class="label">Shell</text>
          <text x="671" y="154" text-anchor="end" class="pct">6.25%</text>
          <rect x="42" y="168" width="629" height="14" rx="7" class="track"/>
          <rect x="42" y="168" width="0" height="14" rx="7" fill="#c084fc"><animate attributeName="width" from="0" to="39.31" dur="1.15s" begin="0.91s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect>
          <rect x="42" y="168" width="70" height="14" rx="7" fill="#fff" opacity="0"><animate attributeName="x" from="-80" to="690" dur="2.8s" begin="1.83s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.22;0" dur="2.8s" begin="1.83s" repeatCount="indefinite"/></rect>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.11s" fill="freeze"/>
          <circle cx="42" cy="212" r="6" fill="#8b5cf6"/>
          <text x="58" y="217" class="label">Other / not detected</text>
          <text x="671" y="217" text-anchor="end" class="pct">31.25%</text>
          <rect x="42" y="231" width="629" height="14" rx="7" class="track"/>
          <rect x="42" y="231" width="0" height="14" rx="7" fill="#8b5cf6"><animate attributeName="width" from="0" to="196.56" dur="1.15s" begin="1.19s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect>
          <rect x="42" y="231" width="70" height="14" rx="7" fill="#fff" opacity="0"><animate attributeName="x" from="-80" to="690" dur="2.8s" begin="2.11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.22;0" dur="2.8s" begin="2.11s" repeatCount="indefinite"/></rect>
        </g>
<text x="42" y="281" class="sub">SQL, DAX and Power BI are skills, not GitHub-detected languages.</text>
</svg>